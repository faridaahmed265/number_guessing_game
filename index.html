<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess My Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>GUESS MY NUMBER</h1>
        <p class="description">I am thinking of a number between 1 and 20.</p>
        
        <div class="input-section">
            <input type="number" id="guessInput" min="1" max="20" placeholder="0">
            <button id="checkBtn">CHECK</button>
        </div>

        <div class="result-section">
            <p id="message">Start guessing...</p>
            <p>Score: <span id="score">20</span></p>
        </div>
        
        <button id="againBtn" class="btn-again">Play Again</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
